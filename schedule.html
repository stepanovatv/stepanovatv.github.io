<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f4b">
  <meta name="description" content="Свободные окна для занятий — расписание в вашей часовой зоне.">
  <title>Расписание занятий</title>
  <link rel="icon" href="./assets/calendar.svg?v=20260918-fast" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css?v=20260918-fast">
  <script type="module" src="./js/app.js?v=20260918-fast"></script>
</head>
<body>
  <a class="skip" href="#schedule">К расписанию</a>
  <main>
    <header class="page-header">
      <h1><img src="./assets/calendar.svg?v=20260918-fast" width="28" height="28" alt="">Расписание занятий</h1>
      <div class="zone-control">
        <label for="timezone">Часовая зона</label>
        <select id="timezone" aria-describedby="timezone-message"></select>
        <p id="timezone-message">Определяем часовую зону…</p>
      </div>
    </header>
    <section id="schedule" tabindex="-1" aria-label="Расписание доступности" aria-busy="true">
      <div class="schedule-toolbar">
        <div><span class="small-label" id="month-label"></span><h2 id="week-label">Расписание</h2></div>
        <nav class="week-nav" aria-label="Навигация по неделям">
          <button id="previous-week" disabled class="icon-button" aria-label="Предыдущая неделя">←</button>
          <button id="current-week" aria-label="Текущая неделя" title="Текущая неделя"><span class="current-week-label">Текущая неделя</span><span class="current-week-icon" aria-hidden="true">↺</span></button>
          <button id="next-week" class="icon-button" aria-label="Следующая неделя">→</button>
        </nav>
      </div>
      <div class="legend"><span><i class="legend-free" aria-hidden="true">✓</i> Свободно</span><span><i class="legend-busy" aria-hidden="true">−</i> Занято</span><span id="slot-duration" class="duration"></span></div>
      <p id="load-status" class="load-status" role="status">Загружаем расписание…</p>
      <button id="retry" hidden>Попробовать снова</button>
      <div id="schedule-content" hidden>
        <nav id="day-tabs" class="day-tabs" aria-label="Выбор дня"></nav>
        <div class="desktop-schedule"><div class="table-scroll"><table id="week-table"><caption class="sr-only">Недельное расписание. Нажмите на окно для подробностей.</caption></table></div></div>
        <div class="mobile-schedule"><h3 id="mobile-date"></h3><div id="day-slots" class="day-slots"></div></div>
      </div>
      <aside id="slot-detail" class="slot-detail" aria-live="polite" hidden></aside>
    </section>
    <footer><span id="updated"></span></footer>
  </main>
  <noscript><p class="load-status">Для просмотра расписания включите JavaScript в браузере.</p></noscript>
</body>
</html>
